    source_terms: "LIBERO README directly points to this Hugging Face dataset distribution and lists datasets CC BY 4.0; conservatively preserve CC BY attribution. HF repo-level Apache-2.0 metadata remains unclarified; upstream issue 150 asks about authorization and is open without maintainer clarification. Do not rely on Apache to waive attribution."
    data_contract: "Versioned per-modality observation streams and action stream with source indices, explicit pre/post/unknown phases, action-to-observation references, content hashes, outcomes, and separate privileged simulator truth; same-row array joins are not alignment evidence"
