hypotheses:
  - id: H1_LATENT_OBSERVABILITY
    statement: "Robotics-relevant state variables are recoverable from intermediate video-generator representations."
    status: open

  - id: H2_LATENT_CORRECTABILITY
    statement: "Intervening on selected internal representations causally improves corresponding generation failures."
    status: open

  - id: H3_SYNTHETIC_SUBSTITUTION
    statement: "Higher physical/geometric consistency increases the amount of real robot data that synthetic trajectories can substitute at matched downstream performance."
    status: open

