      output_sha256: "66b5465a81cc94c7981552dda444b72411e06bd61c4236fe50d9f1d1c873f2a2"
      input_run: "m0/runs/wan_t4_2026-10-02_retry5/run_001"
      method: "Leave one of four adjacent latent-time pairs out; ridge alpha=1 on signed 64-value 2x2x16 latent differences to predict red-proxy XOR occupancy. Compare AP/RMSE with a spatial-site prior; also report absolute-delta energy, RGB-change rank correlation, and object/background enrichment."
      evidence_boundary: "One prompt/seed and one clip; four correlated transitions and seven denoising snapshots are not independent samples. Red-XOR and RGB-change targets are same-output proxies. No object understanding, forecasting, geometry/contact, causal control, policy efficacy, generalization, or M1/M2/M3 completion is established."
      result: "At post-step 029, ridge mean AP was 0.307 vs 0.671 for the spatial-site prior and beat it on 1/4 transitions. Direct absolute-delta energy mean AP was 0.546; red-XOR energy enrichment exceeded 1 on 3/4 transitions (mean ratio 2.255), with positive Spearman correlation to patch RGB change on 3/4. Early direct-energy scores were near chance. Mixed within-clip signal only; no milestone gate advanced."

