      input_run: "m0/runs/wan_t4_2026-10-02_retry5/run_001"
      method: "Leave one of five latent times out; ridge alpha=1 on 64-value 2x2x16 latent patches; compare positive-residual location and average precision to train-time mean occupancy prior. RGB red-threshold proxy only."
      evidence_boundary: "One prompt/seed and one clip; five within-clip temporal folds are correlated and do not establish generalization, geometry/contact, causal control, policy efficacy, or M1/M2/M3 completion."
      result: "x0-hat pre-step 014 had mean held-out center error 0.711 token cells vs coordinate prior 0.906, but this small single-clip difference is not robust; all other x0-hat snapshots were equal to or worse than the prior. Late spatial snapshots rank the same-clip red proxy highly, with the coordinate prior itself at AP 0.940."
    offline_temporal_change_readout:
      experiment_id: EXP-LATENTGATE-M0-TEMPORAL-CHANGE-LOCALIZATION-001
      status: completed_cpu_only_same_clip_mixed_late_temporal_localization_signal_no_robust_readout_gain
