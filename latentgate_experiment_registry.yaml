    limitation: "A hash-verified HDF5 inspection found 50 demos/4669 rows; demo_0 has 90 rows with actions [90,7], states [90,79], and 90-frame 128x128 agent/wrist RGB streams. Its env_args records Panda OSC_POSE, control_delta=true, input range [-1,1], xyz output ±0.05 m, orientation component output ±0.5, and 20 Hz. Across all 50 episodes, saved joint/gripper observation rows exactly match flattened state row k+1 for all 4619 adjacent pairs, establishing the proprioception/state one-row offset. The HDF5 layout is consistent with the pinned LIBERO create_dataset.py writer, but does not record its converter revision. The source writer collects RGB after env.step(action); conditional on this writer, same-row states/actions are pre-action while RGB/proprioception are post-action. The numeric check does not independently establish RGB phase. A candidate transition view uses obs[k-1] with actions[k] for k>=1; the first stored action lacks a pre-action camera sample because cap_index=5 discarded the first five source actions. No timestamp or simulator replay validates camera timing. Reward/done fields contain only a final-row marker that the converter sets unconditionally, not independent task success. The temporary file is not in this repository. LIBERO's README lists CC BY 4.0; preserve attribution while the HF Apache-2.0 tag remains unresolved. Standard LIBERO task lists do not by themselves provide unseen object/layout holdouts. This lane is independent of P4 Gate 1 but does not unblock M1–M3 or establish native-policy efficacy."

